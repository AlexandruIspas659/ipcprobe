name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: tests
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with "Contents: read & write" on AlexandruIspas659/homebrew-tap.
          # Repo → Settings → Secrets and variables → Actions → New repository secret → HOMEBREW_TAP_TOKEN
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The macOS app: built on a Mac runner after the release exists, bundling the *released* universal helper
  # (downloaded from the release, not rebuilt) so the app and the CLI in the same release are byte-identical.
  # Uploads ipcprobe_<version>_macOS.dmg as one more asset on that release.
  macos-app:
    needs: goreleaser
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: download the released helper
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern "ipcprobe_darwin_all.tar.gz" --dir helper
          tar -xzf helper/ipcprobe_darwin_all.tar.gz -C helper
          lipo -info helper/ipcprobe
      - name: build the app and dmg
        run: bash macos/build-app.sh --version "${GITHUB_REF_NAME#v}" --helper "$PWD/helper/ipcprobe"
      - name: upload the dmg to the release
        run: gh release upload "$GITHUB_REF_NAME" macos/dist/ipcprobe_*_macOS.dmg --clobber
